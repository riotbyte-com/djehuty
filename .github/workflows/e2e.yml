name: E2E tests

on:
  workflow_call:
    inputs:
      marker:
        required: true
        type: string
      artifact-suffix:
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Start SPARQL database
        run: |
          docker run -d --name sparql \
            -p 8890:8890 -p 1111:1111 \
            -e DBA_PASSWORD=dba \
            -e "VIRT_Parameters_DirsAllowed=., ../vsp, /usr/share/proj" \
            openlink/virtuoso-opensource-7:7.2.13
          echo "Waiting for Virtuoso to be ready..."
          for i in $(seq 1 30); do
            if docker exec sparql isql 127.0.0.1:1111 dba dba exec="select 1" 2>/dev/null; then
              echo "Virtuoso is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          docker exec sparql isql 127.0.0.1:1111 dba dba exec="select 1" || (echo "Virtuoso failed to start" && exit 1)

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev pkg-config libxml2-dev libxslt1-dev libxmlsec1-openssl

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create pyproject.toml and install package
        run: |
          sed 's/@VERSION@/0.0.0+ci/' pyproject.toml.in > pyproject.toml
          pip install -e .

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Initialize SPARQL permissions
        run: |
          docker cp docker/dev/sparql-init/001-setup_permissions.sql sparql:/tmp/001-setup_permissions.sql
          docker exec sparql isql 1111 dba dba /tmp/001-setup_permissions.sql

      - name: Start application
        run: |
          coverage run -m djehuty.ui web --initialize --config-file .github/ci-djehuty.xml &
          echo $! > /tmp/djehuty.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Application is ready"
              break
            fi
            echo "Waiting for application to start... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:8080/ > /dev/null || (echo "Application failed to start" && exit 1)

      - name: Run E2E tests (${{ inputs.marker }})
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SPARQL_URL: http://localhost:8890/sparql
        run: |
          python -m pytest tests/ -v --tb=short \
            -m "${{ inputs.marker }}" \
            --reruns=1 --reruns-delay=5 \
            --screenshot=only-on-failure \
            --output=test-results

      - name: Stop application and collect coverage
        if: always()
        run: |
          PID=$(cat /tmp/djehuty.pid || echo "")
          if [ -n "$PID" ] && kill -0 "$PID"; then
            kill -TERM "$PID"
            for i in $(seq 1 15); do
              if ! kill -0 "$PID"; then break; fi
              sleep 1
            done
            kill -0 "$PID" && kill -9 "$PID" || true
          fi
          ls -la .coverage*
          mkdir -p /tmp/coverage-data
          cp --verbose .coverage* /tmp/coverage-data/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ inputs.marker }}${{ inputs.artifact-suffix }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ inputs.marker }}${{ inputs.artifact-suffix }}
          path: /tmp/coverage-data/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
